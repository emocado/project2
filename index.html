<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f172a">
  <title>Home Commute</title>
  <style>
    :root {
      --bg: #f8fafc; --card: #ffffff; --text: #0f172a; --muted: #64748b; --line: #e2e8f0;
      --walk: #16a34a; --run: #dc2626; --none: #64748b;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0f172a; --card: #1e293b; --text: #f1f5f9; --muted: #94a3b8; --line: #334155;
              --walk: #22c55e; --run: #f87171; --none: #94a3b8; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text);
           font: 16px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { max-width: 560px; margin: 0 auto; padding: 16px; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    h1 { font-size: 18px; margin: 0; }
    button { font: inherit; padding: 6px 14px; border-radius: 8px; border: 1px solid var(--line);
             background: var(--card); color: var(--text); }
    .verdict { border-radius: 14px; padding: 16px; margin-bottom: 16px; color: #fff; }
    .verdict.walk { background: var(--walk); } .verdict.run { background: var(--run); }
    .verdict.none { background: var(--none); }
    .verdict .big { font-size: 34px; font-weight: 800; }
    .verdict p { margin: 4px 0 0; } .verdict .sub { opacity: .9; font-size: 14px; }
    .route { background: var(--card); border: 1px solid var(--line); border-radius: 12px;
             padding: 12px; margin-bottom: 10px; }
    .route.pick { border: 2px solid var(--text); }
    .head { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
    h2 { font-size: 15px; margin: 0; }
    .eta { font-size: 22px; font-weight: 700; white-space: nowrap; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
    .chip { font-size: 13px; padding: 2px 10px; border-radius: 999px; border: 1px solid currentColor; }
    .chip.walk { color: var(--walk); } .chip.run { color: var(--run); } .chip.missed { color: var(--muted); }
    details { font-size: 13px; color: var(--muted); }
    ul { list-style: none; padding: 0; margin: 6px 0 0; }
    li { display: flex; justify-content: space-between; gap: 8px; padding: 2px 0; border-top: 1px dashed var(--line); }
    #status { font-size: 12px; color: var(--muted); text-align: center; margin-top: 12px; }
  </style>
</head>
<body>
  <main>
    <header><h1>DSTA → Home</h1><button id="refresh">Refresh</button></header>
    <div id="app"></div>
    <p id="status"></p>
    <p id="status-note" style="font-size:12px;color:var(--muted);text-align:center">Big number = estimated time home. Bus times live from LTA; MRT legs are estimates.</p>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
